services:
  neo4j:
    image: neo4j:5.26
    container_name: ikie-neo4j
    profiles: ["local-neo4j"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  api:
    build:
      context: ./backend
    container_name: ikie-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app

volumes:
  neo4j_data: